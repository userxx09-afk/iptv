[versions]
agp = "8.5.2"
kotlin = "2.0.20"
coreKtx = "1.13.1"
lifecycle = "2.8.6"
activityCompose = "1.9.2"
composeBom = "2024.09.02"
media3 = "1.4.1"
coil = "2.7.0"
coroutines = "1.8.1"
securityCrypto = "1.1.0-alpha06"
workManager = "2.9.1"
documentFile = "1.0.1"
# Networking/JSON for shared's commonMain (XtreamClient/TmdbClient) — see the
# comment in shared/build.gradle.kts for why plain HttpURLConnection/org.json
# (Android-only) couldn't just travel to commonMain as-is.
ktor = "3.0.3"
kotlinxSerialization = "1.7.3"

[libraries]
core-ktx            = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
lifecycle-runtime   = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
lifecycle-viewmodel = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
activity-compose    = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom         = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui          = { group = "androidx.compose.ui", name = "ui" }
compose-graphics    = { group = "androidx.compose.ui", name = "ui-graphics" }
compose-preview     = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material3   = { group = "androidx.compose.material3", name = "material3" }
compose-foundation  = { group = "androidx.compose.foundation", name = "foundation" }
media3-exoplayer    = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
media3-hls          = { group = "androidx.media3", name = "media3-exoplayer-hls", version.ref = "media3" }
media3-dash         = { group = "androidx.media3", name = "media3-exoplayer-dash", version.ref = "media3" }
media3-ui           = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
coil-compose        = { group = "io.coil-kt", name = "coil-compose", version.ref = "coil" }
coroutines-android  = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Multiplatform coroutines artifact for shared's commonMain — coroutines-android
# above stays JVM/Android-only and keeps powering the Fire TV-specific bits.
coroutines-core     = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "coroutines" }
security-crypto     = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }
work-runtime        = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "workManager" }
documentfile        = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentFile" }
# ktor-client-core is the commonMain API; okhttp/darwin are the per-platform
# engines that actually open sockets (OkHttp already ships transitively via
# Media3 on Fire TV; Darwin wraps NSURLSession on iOS — see net/HttpEngine.kt).
ktor-client-core     = { group = "io.ktor", name = "ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp   = { group = "io.ktor", name = "ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin   = { group = "io.ktor", name = "ktor-client-darwin", version.ref = "ktor" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
# Version-matched to the Kotlin compiler itself (part of the same JetBrains
# release train), not its own independent version number.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
