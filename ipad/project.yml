# XcodeGen spec for the iPad app's Xcode project.
#
# This file is checked in; TapperIPad.xcodeproj itself is NOT (see
# .gitignore) and is regenerated by CI (and locally, by running
# `xcodegen generate` from this directory) every time. The reason: Xcode's
# project.pbxproj is a fragile plist format with internal object-reference
# UUIDs that is essentially impossible to hand-edit correctly without Xcode
# open to verify it — one bad reference silently corrupts the whole project.
# Generating it deterministically from this YAML spec means Claude (which has
# no Xcode in this sandbox to check its work against) never has to touch that
# file directly, and the actual .xcodeproj is reproducible from source control
# alone. Install with `brew install xcodegen` if working on this locally.

name: TapperIPad
options:
  bundleIdPrefix: io.tapper
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.4.0"
    CURRENT_PROJECT_VERSION: "8"
    # iPad only (device family 2) — this is the iPad app, not a universal
    # iPhone/iPad build. Revisit if that ever changes.
    TARGETED_DEVICE_FAMILY: "2"

targets:
  TapperIPad:
    type: application
    platform: iOS
    sources:
      - path: TapperIPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tapper.ipad
        PRODUCT_NAME: "Tapper IPTV"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Tapper IPTV"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # App Store Connect rejects an iPad upload unless all four
        # orientations are listed — this is required for iPad
        # multitasking (Split View / Slide Over), regardless of which
        # orientations the app actually wants to support in its own UI.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Without this key, every single upload sits in TestFlight under
        # "Missing Compliance" until someone manually answers the export
        # compliance question in App Store Connect - which is exactly what
        # silently held back builds 3 and 4 and made every TestFlight
        # install keep showing the old build. This app only talks HTTPS via
        # standard system networking (URLSession, Ktor's Darwin engine) -
        # no custom/proprietary encryption - which is the "exempt" case, so
        # declaring that upfront here means every future build clears
        # automatically and reaches testers without a manual step.
        ITSAppUsesNonExemptEncryption: false
        # This app connects to arbitrary, user-supplied IPTV sources - M3U
        # playlist URLs and Xtream Codes panel hosts - many of which are
        # plain http://, not https://, which is the norm in this ecosystem
        # (the same reason the Fire TV/Android manifest needs
        # android:usesCleartextTraffic="true"). Without an ATS exception,
        # iOS silently refuses every plain-http request before it ever
        # leaves the device - NSURLErrorDomain Code=-1022, "App Transport
        # Security policy requires...the use of a secure connection" - which
        # is exactly what happened testing the Xtream Codes login against a
        # real http:// panel (http://line.prime4tv.com). Since the host is
        # arbitrary user input decided at runtime, not a fixed domain this
        # app controls, a per-domain NSExceptionDomains allowlist isn't
        # workable here - NSAllowsArbitraryLoads is the correct, deliberate
        # choice for this app's use case, not a shortcut.
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    # Code signing is deliberately NOT configured here. CI passes
    # CODE_SIGN_STYLE/DEVELOPMENT_TEAM/PROVISIONING_PROFILE_SPECIFIER as
    # xcodebuild command-line overrides at archive time instead (see the
    # workflow) — keeps this file identical whether you're building locally
    # (Automatic signing in Xcode's UI) or in CI (manual, from secrets).
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/TapperCore.xcframework
        embed: true
        codeSign: true
