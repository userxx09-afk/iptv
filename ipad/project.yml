# XcodeGen spec for the iPad app's Xcode project.
#
# This file is checked in; TapperIPad.xcodeproj itself is NOT (see
# .gitignore) and is regenerated by CI (and locally, by running
# `xcodegen generate` from this directory) every time. The reason: Xcode's
# project.pbxproj is a fragile plist format with internal object-reference
# UUIDs that is essentially impossible to hand-edit correctly without Xcode
# open to verify it — one bad reference silently corrupts the whole project.
# Generating it deterministically from this YAML spec means Claude (which has
# no Xcode in this sandbox to check its work against) never has to touch that
# file directly, and the actual .xcodeproj is reproducible from source control
# alone. Install with `brew install xcodegen` if working on this locally.

name: TapperIPad
options:
  bundleIdPrefix: io.tapper
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    # iPad only (device family 2) — this is the iPad app, not a universal
    # iPhone/iPad build. Revisit if that ever changes.
    TARGETED_DEVICE_FAMILY: "2"

targets:
  TapperIPad:
    type: application
    platform: iOS
    sources:
      - path: TapperIPad
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.tapper.ipad
        PRODUCT_NAME: "Tapper IPTV"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDisplayName: "Tapper IPTV"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
UISupportedInterfaceOrientations:
  - UIInterfaceOrientationPortrait
  - UIInterfaceOrientationPortraitUpsideDown
  - UIInterfaceOrientationLandscapeLeft
  - UIInterfaceOrientationLandscapeRight
    # Code signing is deliberately NOT configured here. CI passes
    # CODE_SIGN_STYLE/DEVELOPMENT_TEAM/PROVISIONING_PROFILE_SPECIFIER as
    # xcodebuild command-line overrides at archive time instead (see the
    # workflow) — keeps this file identical whether you're building locally
    # (Automatic signing in Xcode's UI) or in CI (manual, from secrets).
    dependencies:
      - framework: ../shared/build/XCFrameworks/release/TapperCore.xcframework
        embed: true
        codeSign: true
