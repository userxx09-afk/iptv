name: Build Fire TV APK

on:
  push:
    branches: [main]
  workflow_dispatch:

# A new push cancels the previous run rather than queueing another build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Releases go to the prod repo with PROD_REPO_TOKEN, so this workflow's own
# token only needs to read the source.
permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Cloud sync sign-in (Settings > Shared watch history). Optional: without
      # these secrets the build still succeeds and the sign-in buttons say
      # they aren't set up. See README, "Cloud sync setup".
      # Optional private signing key. Without these secrets the build is
      # signed with the committed debug key, exactly as before.
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build release APK (shrunk and obfuscated)
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          MICROSOFT_OAUTH_CLIENT_ID: ${{ secrets.MICROSOFT_OAUTH_CLIENT_ID }}
        run: gradle :firetv:assembleRelease --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp firetv/build/outputs/apk/release/*.apk dist/tapper-iptv-${{ github.run_number }}.apk

      # R8's name map, needed to read a crash stack trace from the obfuscated
      # build. Not attached to the release. (On a public repo, any signed-in
      # GitHub user can download Actions artifacts - another reason to go private.)
      - name: Upload R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ github.run_number }}
          path: firetv/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tapper-iptv-apk
          path: dist/*.apk
          retention-days: 30

      # The source repo is private, so installable builds go to the public
      # releases-only "prod" repo, which every Tapper app publishes to.
      # PROD_REPO_TOKEN: a fine-grained token with Contents: read and write on
      # userxx09-afk/prod only (README, "Release pipeline").
      - name: Publish build to prod
        uses: softprops/action-gh-release@v2
        with:
          repository: userxx09-afk/prod
          token: ${{ secrets.PROD_REPO_TOKEN }}
          target_commitish: main
          tag_name: iptv-build-${{ github.run_number }}
          name: Tapper IPTV build ${{ github.run_number }}
          make_latest: false
          body: |
            Tapper IPTV for Fire TV / Android, build ${{ github.run_number }}.
          files: dist/*.apk

      # A fixed address for the Downloader app, always pointing at the newest
      # build: https://github.com/userxx09-afk/prod/releases/download/iptv-latest/tapper-iptv.apk
      - name: Refresh the "latest" install link
        run: cp dist/*.apk dist/tapper-iptv.apk
      - name: Publish latest link to prod
        uses: softprops/action-gh-release@v2
        with:
          repository: userxx09-afk/prod
          token: ${{ secrets.PROD_REPO_TOKEN }}
          target_commitish: main
          tag_name: iptv-latest
          name: Tapper IPTV (latest)
          make_latest: false
          overwrite_files: true
          body: |
            Always the newest Tapper IPTV build. Install link for Downloader:
            https://github.com/userxx09-afk/prod/releases/download/iptv-latest/tapper-iptv.apk
          files: dist/tapper-iptv.apk
